<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字帖生成器</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #f6f7fb;
        }
        #app-frame {
            display: block;
            width: 100vw;
            height: 100vh;
            border: 0;
        }
        /* 加载失败时的提示 */
        #fallback-tip {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: #475569;
            text-align: center;
            padding: 24px 32px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.12);
            max-width: 90vw;
        }
        #fallback-tip h2 {
            margin: 0 0 8px;
            color: #9e2a2b;
            font-size: 18px;
        }
        #fallback-tip p {
            margin: 4px 0;
            font-size: 14px;
            line-height: 1.6;
        }
        #fallback-tip code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #6366f1;
        }
    </style>
</head>
<body>
    <iframe id="app-frame" src="dist/index.html" title="字帖生成器"></iframe>
    <div id="fallback-tip">
        <h2>⚠️ 无法加载字帖生成器</h2>
        <p>请确认 <code>dist/index.html</code> 文件存在。</p>
        <p>如果尚未构建，请先在项目目录运行：<code>npm run build</code></p>
        <p>或者使用开发模式：<code>npm run dev</code></p>
    </div>
    <script>
        // 检测 iframe 是否加载失败（file:// 协议下可能因路径错误失败）
        (function() {
            var frame = document.getElementById('app-frame');
            var tip = document.getElementById('fallback-tip');
            var loaded = false;
            frame.addEventListener('load', function() { loaded = true; });
            // 若 1.5 秒后仍未触发 load，显示提示
            setTimeout(function() {
                if (!loaded) {
                    frame.style.display = 'none';
                    tip.style.display = 'block';
                }
            }, 1500);
        })();
    </script>
</body>
</html>
